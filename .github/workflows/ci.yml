name: SERS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

concurrency:
  group: sers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Drizzle schema generation
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/sers
        run: pnpm exec drizzle-kit generate --config drizzle.config.ts --out /tmp/sers-drizzle-check
      - name: Hermetic test suite
        shell: bash
        run: |
          pnpm exec vitest run \
            --exclude server/performance-evidence.test.ts \
            --exclude server/templates-themes.test.ts \
            --exclude server/copy-templates-barcode.test.ts \
            --exclude server/image-proxy.test.ts
      - name: Production build
        run: pnpm build
      - name: Document environment-dependent integration suite
        shell: bash
        run: |
          cat <<'EOF'
          Integration tests intentionally excluded from the hermetic CI job:
          - server/performance-evidence.test.ts (requires DATABASE_URL)
          - server/templates-themes.test.ts (requires DATABASE_URL)
          - server/copy-templates-barcode.test.ts (depends on template DB state)
          - server/image-proxy.test.ts (requires a running app server on localhost:3000)
          These tests remain in the repository and must run in the staging/integration gate.
          EOF

  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo 'Tracked environment/secrets file detected.'
            exit 1
          fi
      - name: Require lockfile
        run: test -f pnpm-lock.yaml
