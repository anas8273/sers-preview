name: SERS Domain Migration Artifact

on:
  push:
    branches: ["agent/domain-migration"]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate migration
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/sers
        run: pnpm exec drizzle-kit generate --config drizzle.config.ts
      - name: Show generated files
        shell: bash
        run: |
          echo 'Generated/untracked migration files:'
          git status --short drizzle
      - name: Upload generated drizzle state
        uses: actions/upload-artifact@v4
        with:
          name: sers-domain-migration
          path: |
            drizzle/*.sql
            drizzle/meta/*.json
          if-no-files-found: error
          retention-days: 7
