name: SERS Integration Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ["agent/integration-gate"]

concurrency:
  group: sers-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-domain-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sers_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-interval=10s
          --health-timeout=5s
          --health-retries=60
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sers_test
      SERS_INTEGRATION: "1"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bounded PDF parser and filesystem locking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf util-linux poppler-utils
      - name: Apply reviewed Drizzle migrations
        run: pnpm exec drizzle-kit migrate --config drizzle.config.ts
      - name: Domain ownership and IDOR integration tests
        run: pnpm exec vitest run server/domain-integration.test.ts
      - name: Server-backed report draft integration tests
        run: pnpm exec vitest run server/work-report-draft-integration.test.ts
      - name: Immutable WorkVersion output integration tests
        run: pnpm exec vitest run server/work-version-output-integration.test.ts
      - name: Public and protected WorkVersion delivery tests
        run: pnpm exec vitest run server/public-output-integration.test.ts
      - name: Upload reception, recovery, quota and cancellation on MySQL
        run: pnpm exec vitest run server/upload-intent-integration.test.ts
      - name: Upload quota and reception upgrades with existing intent records
        run: pnpm exec vitest run server/upload-intent-migration.test.ts
      - name: Accounts, academic context and current authorization under concurrency
        run: pnpm exec vitest run server/account-integration.test.ts
      - name: Notification isolation and read acknowledgement
        run: pnpm exec vitest run server/notification-integration.test.ts
      - name: Durable OAuth attempts and revocable application sessions
        run: pnpm exec vitest run server/auth-session-integration.test.ts
      - name: Production OAuth routes against a separate synthetic issuer
        run: pnpm exec vitest run server/auth-http-integration.test.ts
      - name: Durable AI admission, budgets, leases and recovery probes
        run: pnpm exec vitest run server/ai-admission-integration.test.ts
      - name: Authenticated AI HTTP with a separate synthetic provider
        run: pnpm exec vitest run server/ai-http-integration.test.ts
      - name: Legacy share concurrency and current revocation
        run: pnpm exec vitest run server/legacy-share-integration.test.ts
      - name: Private monitoring and readiness loss recovery
        run: pnpm exec vitest run server/runtime-observability-integration.test.ts
      - name: Scan completion, publication, cleanup and quota lifecycle
        run: pnpm exec vitest run server/upload-lifecycle-integration.test.ts
      - name: Core journey upgrade preserves legacy records and invitations
        run: pnpm exec vitest run server/core-journeys-migration.test.ts
      - name: Immutable private Word and review authorization
        run: pnpm exec vitest run server/work-version-docx-integration.test.ts
      - name: Private output bytes and revocation across renderer upgrades
        run: pnpm exec vitest run server/work-output-private-reader-integration.test.ts
      - name: Actual ClamAV and bounded PDF parser adversarial suite
        env:
          SERS_SCANNER_INTEGRATION: "1"
        run: pnpm exec vitest run server/upload-scanner-integration.test.ts
      # Validate the canonical seed on the migration-clean database before any
      # suite mutates template fixtures. The seed helper currently short-circuits
      # when a template already exists, so running fixture-mutating suites first
      # would produce an order-dependent false failure.
      - name: Seed canonical legacy templates
        run: >-
          pnpm exec tsx -e
          "import('./server/db.ts').then(async (m) => { await m.seedDefaultTemplates(); process.exit(0); })"
      - name: Template/barcode integration suite
        run: pnpm exec vitest run server/copy-templates-barcode.test.ts
      # Real-DB legacy ownership, rollback, and concurrency behavior is enforced
      # independently by mysql-legacy.yml. The older performance-evidence suite
      # assumes a silent no-op for forbidden deletes, while the hardened contract
      # correctly returns FORBIDDEN; running it here would assert obsolete behavior.
      - name: Existing template DB suite with isolated fixtures
        run: pnpm exec vitest run server/templates-themes.test.ts
      - name: Build browser application
        id: browser-build
        run: pnpm build
      - name: Browser to real MySQL share creation and revocation
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: pnpm exec tsx --test tests/browser/share-mysql.mts
      - name: Browser account invitations, academic years, work and suspension
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: pnpm exec tsx --test tests/browser/account-mysql.mts
      - name: Browser OAuth, persisted session, work creation, logout and replay denial
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: pnpm exec tsx --test tests/browser/auth-mysql.mts
      - name: Browser evidence upload, real scan and private Word download
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        env:
          SERS_SCANNER_INTEGRATION: "1"
        run: pnpm exec tsx --test tests/browser/evidence-mysql.mts
      - name: Browser AI suggestions require confirmation and preserve manual work
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: pnpm exec tsx --test tests/browser/ai-safety.mts
