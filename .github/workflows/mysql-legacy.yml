name: MySQL legacy ownership integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: mysql-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sers-ci-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sers_legacy_integration
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psers-ci-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      INTEGRATION_TESTS: "1"
      DATABASE_URL: mysql://root:sers-ci-only@127.0.0.1:3307/sers_legacy_integration
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Real migrations, ownership, rollback and concurrent writers
        run: pnpm exec tsx --test --test-concurrency=1 server/legacy-ownership.integration.ts
