  katex: 0.18.2
  esbuild: 0.25.10

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

# Only trusted, pinned native toolchain packages may run install scripts; Puppeteer is
# intentionally handled by the project postinstall with its browser download skipped.
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
ignoredBuiltDependencies:
  - puppeteer

# Preserve the existing Vite/server resolution shape while making the setting pnpm-owned.
shamefullyHoist: true
